<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RUN · Roma Alpha</title><style>
:root{--lime:#c3fa45;--ink:#18221b;--muted:#6b756c;--bg:#f4f5f0}*{box-sizing:border-box}body{margin:0;background:#e9ece5;font:16px system-ui,-apple-system,sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0}button:disabled{cursor:default;opacity:.5}.app{max-width:460px;min-height:100dvh;margin:auto;background:var(--bg);padding:24px 22px 108px}.brand{display:flex;justify-content:space-between;align-items:center;font-weight:950;font-size:26px;letter-spacing:-1px}.badge{font-size:11px;letter-spacing:1px;background:var(--ink);color:white;padding:7px 10px;border-radius:20px}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:32px}h1{font-size:36px;letter-spacing:-1.5px;line-height:1.08;margin:10px 0 15px}h2{font-size:19px;margin:26px 0 14px}p{line-height:1.5;color:var(--muted)}.card{background:white;border:1px solid #e5e8de;border-radius:24px;padding:22px;margin:16px 0}.lime{background:var(--lime);border:0}.dark{background:var(--ink);color:white}.dark p{color:#bac4ba}.big{font-size:64px;font-weight:800;letter-spacing:-3px;margin:12px 0 0;font-variant-numeric:tabular-nums}.unit{font-size:18px;letter-spacing:0}.row{display:flex;justify-content:space-between;align-items:center;gap:14px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}.metric{background:white;padding:18px;border-radius:20px}.metric small{display:block;color:var(--muted);margin-bottom:7px}.metric strong{font-size:24px}.btn{background:var(--ink);color:white;font-weight:700;border-radius:16px;padding:17px 20px;width:100%;margin-top:10px}.btn.lime{background:var(--lime);color:var(--ink)}.btn.secondary{background:#e8ece2;color:var(--ink)}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);background:#fffffff2;backdrop-filter:blur(15px);padding:12px 12px max(16px,env(safe-area-inset-bottom));display:flex;z-index:3;border-top:1px solid #e2e6dc}nav button{flex:1;background:none;color:var(--muted);font-size:11px;padding:8px 2px;border-radius:14px}nav button b{display:block;font-size:21px;margin-bottom:4px}nav button.active{color:var(--ink);background:var(--lime);font-weight:700}.notice{font-size:12px;color:var(--muted);line-height:1.5}.map{height:180px;border-radius:22px;overflow:hidden;background:#e5ebdf;position:relative}.map svg{width:100%;height:100%}.map span{position:absolute;bottom:12px;left:12px;background:white;padding:6px 10px;border-radius:20px;font-size:11px}.chips{display:flex;gap:8px;overflow:auto;margin:20px 0}.chips button{white-space:nowrap;border-radius:22px;padding:10px 14px;background:#e6eadf;font-size:12px}.chips button.active{background:var(--ink);color:white}.reward-icon{width:58px;height:58px;border-radius:18px;background:#f1f4eb;display:grid;place-items:center;font-size:30px;flex-shrink:0}.reward h3{margin:0 0 5px;font-size:18px}.reward p{margin:0;font-size:13px}.tag{font-size:12px;font-weight:700;margin:16px 0 6px}.activity{padding:15px 0;border-bottom:1px solid #edf0e8;font-size:14px}.activity:last-child{border:0}.activity small{display:block;color:var(--muted);margin-top:5px}label{display:block;font-size:13px;font-weight:600;margin:18px 0 7px}input,select{width:100%;border:1px solid #dce2d5;border-radius:12px;background:#fafbf8;padding:14px;color:var(--ink)}.avatar{width:75px;height:75px;display:grid;place-items:center;border-radius:50%;background:var(--lime);font-size:25px;font-weight:800}.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:14px;padding:14px 20px;z-index:10;max-width:90%;font-size:14px}dialog{border:0;border-radius:26px;padding:26px;width:min(390px,90%);color:var(--ink)}dialog::backdrop{background:#14201899}dialog h2{margin-top:0}.code{font:700 28px monospace;letter-spacing:3px;background:var(--lime);padding:22px 10px;border-radius:16px;text-align:center}progress{width:100%;height:8px;accent-color:var(--ink)}.link{background:none;text-decoration:underline;color:var(--muted);font-size:12px;margin-top:24px}.empty{text-align:center;padding:28px 10px}button:focus-visible{outline:3px solid #578509;outline-offset:3px}
</style><main class="app"><header class="brand">RUN<span class="badge">ROMA / DEMO</span></header><a href="partner.html" style="display:block;color:var(--muted);font-size:13px;margin-top:12px">Hai un negozio? Scopri RUN Partner →</a><div id="view"></div><nav aria-label="Navigazione principale"></nav></main><dialog id="modal"></dialog><div id="toast" class="toast" role="status" hidden></div>
<script src="model.js"></script>
<script>
const $=s=>document.querySelector(s);const initial=()=>({points:1250,km:12.5,profile:{name:'Manuel',city:'Roma',zone:'Monteverde',age:29,level:'Intermedio',goal:'10 km',frequency:'3 volte a settimana'},activities:[{name:'Corsa del mattino',detail:'5,24 km · 32:18',points:524},{name:'Corsa al parco',detail:'4,26 km · 27:05',points:426},{name:'Corsa del weekend',detail:'3,00 km · 19:12',points:300}],vouchers:[],fund:RunFund.create()});let state;try{state=JSON.parse(localStorage.getItem('run-alpha-v1'))||initial()}catch{state=initial()}if(!state.profile.zone){state.profile.zone='Monteverde';if(state.profile.city==='Milano')state.profile.city='Roma'}
if(!state.fund){state.fund=RunFund.create();state.legacyVouchers=state.vouchers||[]}
let partnerSelected='Bottega del Verde';
let page='run',filter=0,radius=5,liveLocation=null,locating=false,session={active:false,paused:false,seconds:0,km:0};const zones={Monteverde:{lat:41.884,lng:12.452,park:'Villa Doria Pamphilj'},'Flaminio / Ponte Milvio':{lat:41.933,lng:12.467,park:'Lungotevere'},EUR:{lat:41.828,lng:12.466,park:'Laghetto dell’EUR'}};
const rewards=[
{id:1,icon:'☕',name:'Il caffè dopo la corsa',partner:'Bottega del Verde',zone:'Monteverde',lat:41.881,lng:12.454,cost:500,desc:'Un espresso al banco, per chi riparte dal quartiere.',terms:'Senza acquisto minimo · 1 per persona · entro 30 giorni'},
{id:2,icon:'🧦',name:'Il prossimo passo',partner:'Passo Locale',zone:'Monteverde',lat:41.878,lng:12.457,cost:1000,desc:'Calze tecniche in omaggio con una spesa di almeno 35 €.',terms:'Spesa minima 35 € · 1 per persona · entro 30 giorni'},
{id:3,icon:'👟',name:'Nuove strade, nuove scarpe',partner:'Bottega Running',zone:'Flaminio / Ponte Milvio',lat:41.934,lng:12.469,cost:2000,desc:'Sconto del 20% su un paio di scarpe running.',terms:'Esclusi articoli in saldo · 1 per persona · entro 30 giorni'},
{id:4,icon:'🥐',name:'Una colazione di quartiere',partner:'Forno dei Passi',zone:'Monteverde',lat:41.89,lng:12.449,cost:800,desc:'Caffè e cornetto con il 50% di sconto.',terms:'Fino alle 11 · 1 per persona · entro 30 giorni'},
{id:5,icon:'🧘',name:'Recupera, poi riparti',partner:'Spazio Movimento',zone:'EUR',lat:41.829,lng:12.464,cost:1500,desc:'Una lezione di stretching di gruppo in omaggio.',terms:'Su prenotazione · solo prima visita · entro 30 giorni'},
{id:6,icon:'🥤',name:'La tua pausa fresca',partner:'Chiosco del Lungotevere',zone:'Flaminio / Ponte Milvio',lat:41.928,lng:12.466,cost:600,desc:'Una spremuta con il 30% di sconto.',terms:'Senza acquisto minimo · 1 per persona · entro 30 giorni'}]
const fundedOffers=[
{value:200,minimum:200,desc:'Buono da 2 € per il tuo caffè.',terms:'Spesa minima 2 € · 1 per persona · valido 30 giorni'},
{value:500,minimum:3500,desc:'Buono da 5 € per attrezzatura e accessori.',terms:'Spesa minima 35 € · 1 per persona · valido 30 giorni'},
{value:1000,minimum:10000,desc:'Buono da 10 € su un paio di scarpe.',terms:'Spesa minima 100 € · esclusi saldi · valido 30 giorni'},
{value:300,minimum:600,desc:'Buono da 3 € per la colazione dopo la corsa.',terms:'Spesa minima 6 € · fino alle 11 · valido 30 giorni'},
{value:1000,minimum:2000,desc:'Buono da 10 € per una lezione di stretching.',terms:'Spesa minima 20 € · su prenotazione · valido 30 giorni'},
{value:300,minimum:1000,desc:'Buono da 3 € per una pausa al chiosco.',terms:'Spesa minima 10 € · 1 per persona · valido 30 giorni'}];
rewards.forEach((r,i)=>Object.assign(r,fundedOffers[i]));
function distanceTo(r){let c=liveLocation||zones[state.profile.zone]||zones.Monteverde;let rad=d=>d*Math.PI/180;let a=Math.sin(rad(r.lat-c.lat)/2)**2+Math.cos(rad(c.lat))*Math.cos(rad(r.lat))*Math.sin(rad(r.lng-c.lng)/2)**2;return 6371*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}
function nearbyRewards(){return rewards.filter(r=>(!radius||distanceTo(r)<=radius)&&(filter===0||filter===1&&r.cost<1000||filter===2&&r.cost>=1000&&r.cost<2000||filter===3&&r.cost>=2000)).sort((a,b)=>distanceTo(a)-distanceTo(b))}
function changeZone(zone){state.profile.zone=zone;state.profile.city='Roma';liveLocation=null;save();render()}
function locate(){if(!navigator.geolocation){notify('Posizione non disponibile. Puoi scegliere il quartiere.');return}if(locating)return;locating=true;render();navigator.geolocation.getCurrentPosition(pos=>{liveLocation={lat:pos.coords.latitude,lng:pos.coords.longitude};locating=false;render();notify('Distanze aggiornate dalla tua posizione.')},()=>{locating=false;render();notify('Posizione non disponibile: scegli il quartiere per esplorare.')},{enableHighAccuracy:false,timeout:10000,maximumAge:60000})}
function neighborhoodPicker(){return `<label for="zone-picker">Il tuo quartiere a Roma</label><select id="zone-picker" onchange="changeZone(this.value)">${Object.keys(zones).map(z=>`<option ${state.profile.zone===z?'selected':''}>${z}</option>`).join('')}</select>`}
;const money=n=>(n/100).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const fmt=n=>n.toLocaleString('it-IT',{maximumFractionDigits:2});const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const time=n=>`${Math.floor(n/60).toString().padStart(2,'0')}:${(n%60).toString().padStart(2,'0')}`;function save(){try{localStorage.setItem('run-alpha-v1',JSON.stringify(state))}catch{notify('Salvataggio non disponibile: i dati restano in questa pagina.')}}function notify(t){$('#toast').textContent=t;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,3500)}function go(p){page=p;render();if(p==='fund')calculateScenario();window.scrollTo(0,0)}
const map=`<div class="map"><svg viewBox="0 0 400 190" aria-label="Illustrazione di un percorso dimostrativo"><rect width="400" height="190" fill="#e4ebdb"/><path d="M0 40H400M0 100H400M0 160H400M70 0V190M160 0V190M260 0V190M350 0V190" stroke="#fff" stroke-width="14"/><rect x="177" y="14" width="65" height="69" rx="12" fill="#c4d9b2"/><path d="M70 157V43H160V102H260V160H350" fill="none" stroke="#263c27" stroke-width="10" stroke-linejoin="round"/><path d="M70 157V43H160V102H260V160H350" fill="none" stroke="#c3fa45" stroke-width="6" stroke-linejoin="round"/><circle cx="70" cy="157" r="9" fill="#18221b" stroke="white" stroke-width="4"/><circle cx="350" cy="160" r="9" fill="#c3fa45" stroke="#18221b" stroke-width="4"/></svg><span>Percorso illustrativo · GPS non attivo</span></div>`;
function runView(){return `<div class="eyebrow">Roma · ${esc(state.profile.zone)}</div><h1>${session.active?'La tua corsa.<br>Il tuo momento.':`Ciao ${esc(state.profile.name)}.<br>Usciamo a correre?`}</h1><p>E se guadagnassi qualcosa per ogni km corso? Corri vicino a casa, scegli un premio nel tuo quartiere.</p>${map}<p class="notice">La tua zona: ${esc((zones[state.profile.zone]||zones.Monteverde).park)} · App gratuita per gli atleti.</p><div class="card dark"><div class="row"><span>${session.active?(session.paused?'IN PAUSA':'CORSA SIMULATA'):'PRONTO A PARTIRE'}</span><span style="color:var(--lime)">●</span></div><div class="big" id="distance">${fmt(session.km)} <span class="unit">km</span></div><p id="earned">+${Math.floor(session.km*100)} punti previsti</p></div><div class="metrics"><div class="metric"><small>Tempo</small><strong id="time">${time(session.seconds)}</strong></div><div class="metric"><small>Passo medio</small><strong>6:00 <small style="display:inline;font-size:12px">/km</small></strong></div></div>${session.active?`<div class="row"><button class="btn secondary" onclick="pauseRun()">${session.paused?'Riprendi':'Pausa'}</button><button class="btn lime" onclick="finishRun()">Termina</button></div><button class="btn secondary" onclick="addKm()">+1 km di prova</button>`:`<button class="btn lime" onclick="startRun()">▶ Inizia una corsa demo</button><button class="btn secondary" onclick="go('rewards')">Scopri i premi vicino a casa →</button>`}<p class="notice">Questa preview simula la corsa: non usa il GPS. Il tempo scorre e puoi aggiungere chilometri di prova. I punti vengono accreditati quando termini.</p>`}
function walletView(){return `<div class="eyebrow">Il movimento ripaga</div><h1>Il tuo wallet.</h1><div class="card lime"><span>Punti disponibili</span><div class="big">${fmt(state.points)}</div><p style="color:var(--ink)">${fmt(state.km)} km corsi in totale</p></div><div class="card row"><strong>1 km = 100 punti</strong><span>↗</span></div><button class="btn" onclick="go('rewards')">Scegli il tuo prossimo premio →</button><h2>Ultimi movimenti</h2><div class="card">${state.activities.map(a=>`<div class="activity row"><div>${esc(a.name)}<small>${esc(a.detail)}</small></div><strong>${a.points>0?'+':''}${fmt(a.points)} pt</strong></div>`).join('')}</div><h2>I tuoi voucher</h2>${voucherCards()}`}
function rewardsView(){const nearby=nearbyRewards();return `<div class="eyebrow">Roma · Commercio di quartiere</div><h1>Corri qui.<br>Il premio è vicino.</h1><p>I tuoi chilometri diventano vantaggi nelle botteghe della tua zona.</p><div class="card lime row"><span>Il tuo saldo</span><strong>✦ ${fmt(state.points)} punti</strong></div>${neighborhoodPicker()}<button class="btn secondary" onclick="locate()" ${locating?'disabled':''}>${locating?'Cerco la posizione…':'◎ Usa la mia posizione'}</button><p class="notice">${liveLocation?'Distanze dalla tua posizione, usata solo per questa visita e non salvata.':'Distanze indicative dal centro del quartiere selezionato, non da casa tua.'} Distanze in linea d’aria. Attività e sedi sono inventate per il mockup.</p><label for="radius">Quanto vicino?</label><select id="radius" onchange="radius=Number(this.value);render()">${[[2,'Entro 2 km'],[5,'Entro 5 km'],[10,'Entro 10 km'],[0,'Tutte le zone del pilota']].map(([v,t])=>`<option value="${v}" ${radius===v?'selected':''}>${t}</option>`).join('')}</select><div class="chips">${['Tutti','500–999 pt','1.000–1.999 pt','2.000+ pt'].map((t,i)=>`<button class="${filter===i?'active':''}" onclick="filter=${i};render()">${t}</button>`).join('')}</div><h2>${nearby.length} premi da scoprire</h2>${nearby.map(r=>`<article class="card reward"><div class="row"><div class="reward-icon">${r.icon}</div><div><h3>${r.name}</h3><p>${r.partner} · Partner demo</p></div></div><div class="tag">↗ ${fmt(distanceTo(r))} km · ${r.zone}</div><p>${r.desc}</p><div class="tag">${fmt(r.cost)} punti · ${r.cost/100} km di corsa</div><progress max="${r.cost}" value="${Math.min(state.points,r.cost)}"></progress><p class="notice" style="margin-top:12px">${r.terms}<br>Il fondo riserva ${money(r.value)} all’emissione del codice.</p><button class="btn ${state.points>=r.cost?'lime':'secondary'}" ${!canIssue(r)?'disabled':''} onclick="confirmReward(${r.id})">${claimLabel(r)}</button></article>`).join('')||'<div class="card empty"><h2>Nessun premio con questi filtri.</h2><p>Amplia la distanza o scegli un’altra fascia di punti.</p><button class="btn secondary" onclick="radius=0;filter=0;render()">Mostra tutti i premi di Roma</button></div>'}<div class="card"><strong>Premi finanziati dai partner</strong><p class="notice">I codici disponibili dipendono dal budget della campagna. I punti non garantiscono premi illimitati.</p></div><p class="notice">1 km = 100 punti nella demo. I punti non sono denaro. Offerte e partner sono dimostrativi, senza valore commerciale.</p>`}
function profileView(){let p=state.profile;return `<div class="eyebrow">Il tuo punto di partenza</div><h1>Ogni runner<br>ha la sua storia.</h1><div class="avatar">${esc(p.name.slice(0,2).toUpperCase())}</div><form onsubmit="saveProfile(event)"><h2>Informazioni di base</h2><label for="name">Nome</label><input id="name" name="name" required maxlength="40" value="${esc(p.name)}" autocomplete="given-name"><div class="row"><div style="flex:1"><label for="age">Età</label><input id="age" name="age" type="number" min="1" max="120" required value="${p.age}"></div><div style="flex:2"><label for="city">Città</label><input id="city" name="city" readonly value="Roma"></div></div><label for="zone">Quartiere in cui corri</label><select id="zone" name="zone">${Object.keys(zones).map(z=>`<option ${p.zone===z?'selected':''}>${z}</option>`).join('')}</select><h2>Tu e la corsa</h2>${[['level','Livello',['Principiante','Intermedio','Esperto']],['goal','Il tuo obiettivo',['Iniziare a correre','5 km','10 km','Mezza maratona','Maratona']],['frequency','Quante volte corri?',['1 volta a settimana','2 volte a settimana','3 volte a settimana','4 o più volte a settimana']]].map(([key,label,opts])=>`<label for="${key}">${label}</label><select id="${key}" name="${key}">${opts.map(o=>`<option ${p[key]===o?'selected':''}>${o}</option>`).join('')}</select>`).join('')}<button class="btn lime" type="submit">Salva il profilo</button></form><p class="notice">Dati salvati soltanto in questo browser, se lo spazio locale è disponibile. Nessun account, nessun invio a server.</p><button class="link" onclick="resetDemo()">Ripristina tutti i dati dimostrativi</button>`}
function render(){expireVouchers();const views={partner:partnerView,fund:fundView,run:runView,wallet:walletView,rewards:rewardsView,profile:profileView};$('#view').innerHTML=views[page]();$('nav').innerHTML=[['run','↗','Corri'],['wallet','◈','Wallet'],['rewards','☆','Premi'],['profile','◎','Profilo'],['partner','▣','Partner']].map(([p,i,n])=>`<button aria-label="${n}" class="${page===p?'active':''}" ${page===p?'aria-current="page"':''} onclick="go('${p}')"><b>${i}</b>${n}</button>`).join('')}
function startRun(){session={active:true,paused:false,seconds:0,km:0};render()}function pauseRun(){session.paused=!session.paused;render()}function addKm(){if(session.paused){notify('Riprendi la corsa per aggiungere chilometri.');return}session.km+=1;session.seconds+=360;render()}function finishRun(){let points=Math.floor(session.km*100);state.points+=points;state.km=Math.round((state.km+session.km)*1000)/1000;if(session.km>0)state.activities.unshift({name:'Corsa demo completata',detail:`${fmt(session.km)} km · ${time(session.seconds)}`,points});save();session={active:false,paused:false,seconds:0,km:0};go('wallet');notify(`Corsa terminata: +${points} punti nel wallet.`)}
function saveProfile(e){e.preventDefault();let d=new FormData(e.target);state.profile=Object.fromEntries(d);state.profile.age=Number(state.profile.age);liveLocation=null;save();notify('Profilo aggiornato');render()}
function expireVouchers(){const expired=RunFund.expire(state.fund);if(expired.length){for(const v of expired){state.points+=v.cost;state.activities.unshift({name:v.name,detail:'Voucher scaduto: punti restituiti',points:v.cost})}save()}return expired.length}
function hasClaim(r){return state.fund.vouchers.some(v=>v.id===r.id&&!['expired','cancelled'].includes(v.status))}
function canIssue(r){return !hasClaim(r)&&state.points>=r.cost&&RunFund.totals(state.fund).available>=r.value&&Date.now()<state.fund.endsAt}
function claimLabel(r){if(hasClaim(r))return 'Già richiesto';if(Date.now()>=state.fund.endsAt)return 'Campagna terminata';if(state.points<r.cost)return `Mancano ${fmt(r.cost-state.points)} punti`;if(RunFund.totals(state.fund).available<r.value)return 'Budget premi esaurito';return 'Ottieni il codice'}
function confirmReward(id){expireVouchers();const r=rewards.find(r=>r.id===id);if(!r||!canIssue(r)){render();notify('Premio non disponibile con saldo e budget attuali.');return}$('#modal').innerHTML=`<h2>Un premio meritato.</h2><p>${r.name} · ${r.partner}</p><p>Usi <strong>${fmt(r.cost)} punti</strong>. Il fondo riserva ${money(r.value)}: il negozio riceverà il rimborso solo dopo la verifica dell’acquisto.</p><p>${r.terms}</p><p class="notice">Solo simulazione: nessun pagamento reale.</p><button class="btn lime" onclick="redeem(${id})">Conferma e genera codice</button><button class="btn secondary" onclick="$('#modal').close()">Annulla</button>`;$('#modal').showModal()}
function redeem(id){expireVouchers();try{const r=rewards.find(r=>r.id===id);const v=RunFund.issue(state.fund,r,state.points,'RUN-'+crypto.randomUUID().slice(0,8).toUpperCase());state.points-=r.cost;state.activities.unshift({name:r.name,detail:'Codice emesso · fondi riservati',points:-r.cost});save();$('#modal').innerHTML=`<h2>Il codice è pronto.</h2><p>${r.name}</p><div class="code">${v.code}</div><p>Vantaggio ${money(v.value)} · spesa minima ${money(v.minimum)}.</p><p class="notice">Demo: nessun valore commerciale. Prova la verifica nella scheda Partner sullo stesso dispositivo.</p><button class="btn lime" onclick="$('#modal').close();go('wallet')">Vai al wallet</button>`;render()}catch(e){notify(e.message)}}
const statusLabel={issued:'Emesso · fondi riservati',validated:'Utilizzato · rimborso da liquidare',paid:'Rimborso liquidato (demo)',expired:'Scaduto · punti restituiti',cancelled:'Annullato · punti restituiti',refunded:'Reso · punti restituiti'};
function voucherCards(){return (state.fund.vouchers.map(v=>`<div class="card"><strong>${esc(v.name)}</strong><p>${esc(v.partner)}</p><div class="code">${esc(v.code)}</div><p>${money(v.value)} su almeno ${money(v.minimum)}</p><p class="notice">${statusLabel[v.status]}<br>Scade il ${new Date(v.expiresAt).toLocaleDateString('it-IT')}<br>${esc(v.terms)}<br>Solo simulazione, nessun valore commerciale.</p>${v.status==='issued'?`<button class="btn secondary" onclick="cancelVoucher('${v.code}')">Annulla e recupera i punti</button><button class="btn" onclick="openPartner('${v.partner}')">Prova verifica partner</button>`:''}</div>`).join('')||'<p>Nessun voucher. Scegli un premio vicino a te.</p>')+(state.legacyVouchers?.length?'<p class="notice">I voucher della precedente versione sono archiviati: non impegnano il nuovo fondo demo.</p>':'')}
function cancelVoucher(code){try{const v=RunFund.cancel(state.fund,code);state.points+=v.cost;state.activities.unshift({name:v.name,detail:'Codice annullato',points:v.cost});save();render();notify('Punti restituiti e budget liberato.')}catch(e){notify(e.message)}}
function openPartner(partner){partnerSelected=partner;go('partner')}
function euroInput(raw){return Math.round(Number(raw)*100)}
function partnerView(){const vouchers=state.fund.vouchers.filter(v=>v.partner===partnerSelected);const t=RunFund.totals(state.fund);return `<div class="eyebrow">Area commerciante · demo senza login</div><h1>I runner entrano.<br>Il quartiere cresce.</h1><p>Rimborsi accessibili solo con un voucher e un acquisto validati. Tutto è simulato nello stesso browser.</p><label for="partner-select">Partner da simulare</label><select id="partner-select" onchange="partnerSelected=this.value;render()">${rewards.map(r=>`<option ${r.partner===partnerSelected?'selected':''}>${r.partner}</option>`).join('')}</select><div class="card dark"><span>Contributo iniziale per partner</span><h2>1.000 €</h2><p>Fondo comune iniziale 7.500 € per 10 partner. Nessun rimborso individuale garantito, nessun tetto per partner nella demo.</p><button class="btn lime" onclick="go('fund')">Apri fondo e simulatore →</button></div><div class="metrics"><div class="metric"><small>Da liquidare</small><strong>${money(vouchers.filter(v=>v.status==='validated').reduce((s,v)=>s+v.value,0))}</strong></div><div class="metric"><small>Liquidato demo</small><strong>${money(vouchers.filter(v=>v.status==='paid').reduce((s,v)=>s+v.value,0))}</strong></div></div><h2>Verifica un acquisto</h2><form class="card" onsubmit="validatePurchase(event)"><label for="voucher-code">Codice voucher</label><input id="voucher-code" name="code" required placeholder="RUN-XXXXXXXX" autocapitalize="characters"><label for="receipt">Riferimento acquisto</label><input id="receipt" name="receipt" required minlength="3" maxlength="60" placeholder="SCONTRINO-001"><label for="purchase-total">Totale prima del voucher (€)</label><input id="purchase-total" name="total" type="number" min="0.01" max="1000000" step="0.01" required><label><input type="checkbox" name="confirmed" required style="width:auto"> Confermo acquisto e condizioni dell’offerta</label><button class="btn lime">Verifica e registra utilizzo</button><p class="notice">Nell’app reale serviranno autenticazione, prova d’acquisto e verifiche lato server. Questa spunta non è una verifica antifrode.</p></form><h2>Voucher del partner</h2>${vouchers.map(v=>`<div class="card"><strong>${esc(v.code)}</strong><p>${statusLabel[v.status]} · ${money(v.value)}</p>${v.total?`<p class="notice">Acquisto ${money(v.total)} = ${money(v.customerPaid)} dal runner + ${money(v.value)} dal fondo.<br>Riferimento ${esc(v.receipt)}</p>`:''}${v.status==='issued'?`<button class="btn secondary" onclick="fillVoucher('${v.code}')">Inserisci nel modulo</button>`:''}${v.status==='validated'?`<button class="btn lime" onclick="settleVoucher('${v.code}')">Simula liquidazione ${money(v.value)}</button>`:''}${['validated','paid'].includes(v.status)?`<button class="btn secondary" onclick="refundVoucher('${v.code}')">Simula reso totale${v.status==='paid'?' e recupero rimborso':''}</button>`:''}</div>`).join('')||'<p>Nessun codice per questo partner. Generane uno dalla sezione Premi.</p>'}<p class="notice">Disponibilità del fondo comune: ${money(t.available)}. Sei partner hanno offerte demo; altri quattro sono soltanto inclusi nell’ipotesi di finanziamento.</p>`}
function fillVoucher(code){$('#voucher-code').value=code;$('#voucher-code').focus();$('#voucher-code').scrollIntoView({block:'center',behavior:'smooth'})}
function validatePurchase(event){event.preventDefault();expireVouchers();try{const form=new FormData(event.target);const v=RunFund.validate(state.fund,{code:String(form.get('code')).trim().toUpperCase(),partner:partnerSelected,receipt:String(form.get('receipt')),total:euroInput(form.get('total'))});save();render();notify(`Acquisto registrato: ${money(v.value)} da liquidare.`)}catch(e){render();notify(e.message)}}
function settleVoucher(code){try{RunFund.settle(state.fund,code);save();render();notify('Liquidazione simulata. Nessun bonifico eseguito.')}catch(e){notify(e.message)}}
function refundVoucher(code){$('#modal').innerHTML=`<h2>Simula un reso totale</h2><p>Il fondo recupera il contributo e il runner recupera i punti. Se già liquidato, il recupero dal partner è simulato come immediato. Nella realtà dovrà essere confermato prima di liberare il budget.</p><button class="btn" onclick="confirmRefund('${code}')">Conferma reso demo</button><button class="btn secondary" onclick="$('#modal').close()">Annulla</button>`;$('#modal').showModal()}
function confirmRefund(code){try{const v=RunFund.refund(state.fund,code);state.points+=v.cost;state.activities.unshift({name:v.name,detail:'Reso totale demo',points:v.cost});save();$('#modal').close();render();notify('Reso e recupero contributo simulati.')}catch(e){notify(e.message)}}
function fundView(){const t=RunFund.totals(state.fund);return `<div class="eyebrow">Fondo condiviso · controllo demo</div><h1>Un fondo comune.<br>Valore al quartiere.</h1><p>Campagna pilota di 90 giorni. Versamenti e liquidazioni mostrati qui sono interamente simulati.</p><div class="card lime"><span>Budget disponibile per nuovi codici</span><div class="big" style="font-size:44px">${money(t.available)}</div><p style="color:var(--ink)">Fine campagna ${new Date(state.fund.endsAt).toLocaleDateString('it-IT')}</p></div><div class="card"><div class="activity row"><span>Contributi complessivi</span><strong>${money(t.gross)}</strong></div><div class="activity row"><span>75% fondo premi</span><strong>${money(t.pool)}</strong></div><div class="activity row"><span>15% quota app</span><strong>${money(t.app)}</strong></div><div class="activity row"><span>10% investimenti</span><strong>${money(t.investment)}</strong></div></div><div class="card"><div class="activity row"><span>Riservato ai codici</span><strong>${money(t.reserved)}</strong></div><div class="activity row"><span>Rimborsi da liquidare</span><strong>${money(t.payable)}</strong></div><div class="activity row"><span>Liquidato demo</span><strong>${money(t.paid)}</strong></div><p class="notice">Fondo premi = disponibile + riservato + da liquidare + liquidato. Le quote app e investimenti non finanziano i voucher.</p></div><form class="card" onsubmit="topUpFund(event)"><h2>Prova un rifinanziamento</h2><label for="topup">Nuovo contributo (€)</label><input id="topup" name="amount" type="number" min="1" max="1000000" step="1" value="1000" required><button class="btn secondary">Aggiungi contributo demo</button><p class="notice">Si applica nuovamente la ripartizione 75/15/10. Non estende la durata della campagna.</p></form><h2>Simulatore economico</h2><p>Scenari indipendenti dal fondo demo. Il margine dipende da acquisti aggiuntivi: il rimborso non è profitto.</p><form class="card" id="scenario-form" onsubmit="event.preventDefault();calculateScenario()">${[['partners','Partner',10,1,1000,1],['fee','Contributo per partner (€)',1000,1,1000000,1],['benefit','Voucher medio (€)',10,1,1000,1],['ticket','Scontrino medio prima del voucher (€)',80,1,100000,1],['margin','Margine lordo merce (%)',40,0,100,1],['incrementality','Acquisti realmente aggiuntivi (%)',50,0,100,1],['utilization','Utilizzo del budget (%)',80,0,100,1],['share','Quota riscatti del singolo partner (%)',10,0,100,1],['fixedCost','Costi operativi fissi RUN (€)',1000,0,1000000,1],['claimCost','Costo RUN per utilizzo (€)',0.5,0,1000,0.01]].map(([name,label,value,min,max,step])=>`<label for="sim-${name}">${label}</label><input id="sim-${name}" name="${name}" type="number" value="${value}" min="${min}" max="${max}" step="${step}" required>`).join('')}<button class="btn lime">Calcola scenario</button><div id="scenario-result" aria-live="polite"></div></form><p class="notice">Stime illustrative, non previsioni. Costi RUN inseriti sono ipotesi modificabili. Esclusi IVA, fiscalità, resi e riacquisti futuri; commissioni di pagamento da includere nei costi RUN. La quota investimenti è un’allocazione da definire contabilmente, non un costo già sostenuto.</p><button class="btn secondary" onclick="go('partner')">Torna al partner</button>`}
function topUpFund(event){event.preventDefault();try{RunFund.topUp(state.fund,euroInput(new FormData(event.target).get('amount')));save();render();notify('Contributo demo aggiunto. Nessun addebito reale.')}catch(e){notify(e.message)}}
function calculateScenario(){const data=Object.fromEntries(new FormData($('#scenario-form')));for(const key of Object.keys(data))data[key]=Number(data[key]);try{const r=RunFund.scenario(data);$('#scenario-result').innerHTML=`<h2>Risultati stimati</h2>${[['Fondo premi',r.pool],['Quota app prima dei costi',r.app],['Costi operativi RUN ipotizzati',r.operatingCost],['Quota app meno costi operativi',r.platformNet],['Allocazione investimenti',r.investment],['Budget non utilizzato',r.unused],['Vendite associate',r.sales],['Margine incrementale circuito',r.incrementalMargin],['Margine circuito meno contributi',r.net],['Rimborsi al partner scelto',r.targetPayout],['Margine incrementale partner meno contributo',r.targetNet]].map(([label,value])=>`<div class="activity row"><span>${label}</span><strong>${money(Math.round(value*100))}</strong></div>`).join('')}<p>Capienza massima: <strong>${r.capacity} voucher</strong>. Utilizzati nello scenario: <strong>${r.claims}</strong>, di cui <strong>${r.targetClaims}</strong> al partner scelto.</p><p>Acquisti attribuiti necessari al pareggio del partner: <strong>${r.breakEven===null?'non raggiungibile con queste ipotesi':r.breakEven}</strong>.</p><p class="notice">I rimborsi sono già inclusi nell’incasso pieno dello scontrino: non si sommano una seconda volta al margine. La quota di riscatti scelta descrive la concentrazione, non impone un tetto.</p>`}catch(e){$('#scenario-result').textContent=e.message}}

function resetDemo(){$('#modal').innerHTML=`<h2>Ripartire da zero?</h2><p>Profilo, corse, fondo e voucher demo saranno ripristinati.</p><button class="btn" onclick="confirmReset()">Ripristina demo</button><button class="btn secondary" onclick="document.querySelector('#modal').close()">Annulla</button>`;$('#modal').showModal()}
function confirmReset(){state=initial();partnerSelected='Bottega del Verde';liveLocation=null;radius=5;filter=0;session={active:false,paused:false,seconds:0,km:0};save();$('#modal').close();render()}
setInterval(()=>{if(expireVouchers())render()},30000);
setInterval(()=>{if(session.active&&!session.paused){session.seconds++;session.km+=1/360;if(page==='run'){$('#distance').innerHTML=fmt(session.km)+' <span class="unit">km</span>';$('#time').textContent=time(session.seconds);$('#earned').textContent='+'+Math.floor(session.km*100)+' punti previsti'}}},1000);save();render();
</script></html>
