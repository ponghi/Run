<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RUN · Alpha interattiva</title><style>
:root{--lime:#c3fa45;--ink:#18221b;--muted:#6b756c;--bg:#f4f5f0}*{box-sizing:border-box}body{margin:0;background:#e9ece5;font:16px system-ui,-apple-system,sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0}button:disabled{cursor:default;opacity:.5}.app{max-width:460px;min-height:100dvh;margin:auto;background:var(--bg);padding:24px 22px 108px}.brand{display:flex;justify-content:space-between;align-items:center;font-weight:950;font-size:26px;letter-spacing:-1px}.badge{font-size:11px;letter-spacing:1px;background:var(--ink);color:white;padding:7px 10px;border-radius:20px}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:32px}h1{font-size:36px;letter-spacing:-1.5px;line-height:1.08;margin:10px 0 15px}h2{font-size:19px;margin:26px 0 14px}p{line-height:1.5;color:var(--muted)}.card{background:white;border:1px solid #e5e8de;border-radius:24px;padding:22px;margin:16px 0}.lime{background:var(--lime);border:0}.dark{background:var(--ink);color:white}.dark p{color:#bac4ba}.big{font-size:64px;font-weight:800;letter-spacing:-3px;margin:12px 0 0;font-variant-numeric:tabular-nums}.unit{font-size:18px;letter-spacing:0}.row{display:flex;justify-content:space-between;align-items:center;gap:14px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}.metric{background:white;padding:18px;border-radius:20px}.metric small{display:block;color:var(--muted);margin-bottom:7px}.metric strong{font-size:24px}.btn{background:var(--ink);color:white;font-weight:700;border-radius:16px;padding:17px 20px;width:100%;margin-top:10px}.btn.lime{background:var(--lime);color:var(--ink)}.btn.secondary{background:#e8ece2;color:var(--ink)}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);background:#fffffff2;backdrop-filter:blur(15px);padding:12px 12px max(16px,env(safe-area-inset-bottom));display:flex;z-index:3;border-top:1px solid #e2e6dc}nav button{flex:1;background:none;color:var(--muted);font-size:11px;padding:8px 2px;border-radius:14px}nav button b{display:block;font-size:21px;margin-bottom:4px}nav button.active{color:var(--ink);background:var(--lime);font-weight:700}.notice{font-size:12px;color:var(--muted);line-height:1.5}.map{height:180px;border-radius:22px;overflow:hidden;background:#e5ebdf;position:relative}.map svg{width:100%;height:100%}.map span{position:absolute;bottom:12px;left:12px;background:white;padding:6px 10px;border-radius:20px;font-size:11px}.chips{display:flex;gap:8px;overflow:auto;margin:20px 0}.chips button{white-space:nowrap;border-radius:22px;padding:10px 14px;background:#e6eadf;font-size:12px}.chips button.active{background:var(--ink);color:white}.reward-icon{width:58px;height:58px;border-radius:18px;background:#f1f4eb;display:grid;place-items:center;font-size:30px;flex-shrink:0}.reward h3{margin:0 0 5px;font-size:18px}.reward p{margin:0;font-size:13px}.tag{font-size:12px;font-weight:700;margin:16px 0 6px}.activity{padding:15px 0;border-bottom:1px solid #edf0e8;font-size:14px}.activity:last-child{border:0}.activity small{display:block;color:var(--muted);margin-top:5px}label{display:block;font-size:13px;font-weight:600;margin:18px 0 7px}input,select{width:100%;border:1px solid #dce2d5;border-radius:12px;background:#fafbf8;padding:14px;color:var(--ink)}.avatar{width:75px;height:75px;display:grid;place-items:center;border-radius:50%;background:var(--lime);font-size:25px;font-weight:800}.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:14px;padding:14px 20px;z-index:10;max-width:90%;font-size:14px}dialog{border:0;border-radius:26px;padding:26px;width:min(390px,90%);color:var(--ink)}dialog::backdrop{background:#14201899}dialog h2{margin-top:0}.code{font:700 28px monospace;letter-spacing:3px;background:var(--lime);padding:22px 10px;border-radius:16px;text-align:center}progress{width:100%;height:8px;accent-color:var(--ink)}.link{background:none;text-decoration:underline;color:var(--muted);font-size:12px;margin-top:24px}.empty{text-align:center;padding:28px 10px}button:focus-visible{outline:3px solid #578509;outline-offset:3px}
</style><main class="app"><header class="brand">RUN<span class="badge">ALPHA / DEMO</span></header><div id="view"></div><nav aria-label="Navigazione principale"></nav></main><dialog id="modal"></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
const $=s=>document.querySelector(s);const initial=()=>({points:1250,km:12.5,profile:{name:'Manuel',city:'Milano',age:29,level:'Intermedio',goal:'10 km',frequency:'3 volte a settimana'},activities:[{name:'Corsa del mattino',detail:'5,24 km · 32:18',points:524},{name:'Corsa al parco',detail:'4,26 km · 27:05',points:426},{name:'Corsa del weekend',detail:'3,00 km · 19:12',points:300}],vouchers:[]});let state;try{state=JSON.parse(localStorage.getItem('run-alpha-v1'))||initial()}catch{state=initial()}let page='run',filter=0,session={active:false,paused:false,seconds:0,km:0};const rewards=[{id:1,icon:'☕',name:'Un caffè, offerto da te',partner:'Caffè del Parco',cost:500,desc:'Un espresso al banco. Una pausa meritata.'},{id:2,icon:'🧦',name:'Il prossimo passo',partner:'Urban Sport',cost:1000,desc:'Un paio di calze tecniche per la prossima corsa.'},{id:3,icon:'👟',name:'Nuove strade, nuove scarpe',partner:'Running Lab',cost:2000,desc:'Buono sconto del 20% su un paio di scarpe running.'}];const fmt=n=>n.toLocaleString('it-IT',{maximumFractionDigits:2});const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const time=n=>`${Math.floor(n/60).toString().padStart(2,'0')}:${(n%60).toString().padStart(2,'0')}`;function save(){try{localStorage.setItem('run-alpha-v1',JSON.stringify(state))}catch{notify('Salvataggio non disponibile: i dati restano in questa pagina.')}}function notify(t){$('#toast').textContent=t;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,3500)}function go(p){page=p;render();window.scrollTo(0,0)}
const map=`<div class="map"><svg viewBox="0 0 400 190" aria-label="Illustrazione di un percorso dimostrativo"><rect width="400" height="190" fill="#e4ebdb"/><path d="M0 40H400M0 100H400M0 160H400M70 0V190M160 0V190M260 0V190M350 0V190" stroke="#fff" stroke-width="14"/><rect x="177" y="14" width="65" height="69" rx="12" fill="#c4d9b2"/><path d="M70 157V43H160V102H260V160H350" fill="none" stroke="#263c27" stroke-width="10" stroke-linejoin="round"/><path d="M70 157V43H160V102H260V160H350" fill="none" stroke="#c3fa45" stroke-width="6" stroke-linejoin="round"/><circle cx="70" cy="157" r="9" fill="#18221b" stroke="white" stroke-width="4"/><circle cx="350" cy="160" r="9" fill="#c3fa45" stroke="#18221b" stroke-width="4"/></svg><span>Percorso illustrativo · GPS non attivo</span></div>`;
function runView(){return `<div class="eyebrow">Ogni passo vale</div><h1>${session.active?'La tua corsa.<br>Il tuo momento.':`Ciao ${esc(state.profile.name)}.<br>Usciamo a correre?`}</h1><p>Trasforma i tuoi chilometri in piccoli traguardi. E in premi.</p>${map}<div class="card dark"><div class="row"><span>${session.active?(session.paused?'IN PAUSA':'CORSA SIMULATA'):'PRONTO A PARTIRE'}</span><span style="color:var(--lime)">●</span></div><div class="big" id="distance">${fmt(session.km)} <span class="unit">km</span></div><p id="earned">+${Math.floor(session.km*100)} punti previsti</p></div><div class="metrics"><div class="metric"><small>Tempo</small><strong id="time">${time(session.seconds)}</strong></div><div class="metric"><small>Passo medio</small><strong>6:00 <small style="display:inline;font-size:12px">/km</small></strong></div></div>${session.active?`<div class="row"><button class="btn secondary" onclick="pauseRun()">${session.paused?'Riprendi':'Pausa'}</button><button class="btn lime" onclick="finishRun()">Termina</button></div><button class="btn secondary" onclick="addKm()">+1 km di prova</button>`:`<button class="btn lime" onclick="startRun()">▶ Inizia una corsa demo</button>`}<p class="notice">Questa preview simula la corsa: non usa il GPS. Il tempo scorre e puoi aggiungere chilometri di prova. I punti vengono accreditati quando termini.</p>`}
function walletView(){return `<div class="eyebrow">Il movimento ripaga</div><h1>Il tuo wallet.</h1><div class="card lime"><span>Punti disponibili</span><div class="big">${fmt(state.points)}</div><p style="color:var(--ink)">${fmt(state.km)} km corsi in totale</p></div><div class="card row"><strong>1 km = 100 punti</strong><span>↗</span></div><button class="btn" onclick="go('rewards')">Scegli il tuo prossimo premio →</button><h2>Ultimi movimenti</h2><div class="card">${state.activities.map(a=>`<div class="activity row"><div>${esc(a.name)}<small>${esc(a.detail)}</small></div><strong>${a.points>0?'+':''}${fmt(a.points)} pt</strong></div>`).join('')}</div><h2>I tuoi voucher</h2>${state.vouchers.length?state.vouchers.map(v=>`<div class="card"><strong>${esc(v.name)}</strong><p>${esc(v.partner)}</p><div class="code">${esc(v.code)}</div><p class="notice">Voucher dimostrativo, non valido per acquisti.</p></div>`).join(''):'<p>Nessun premio riscattato. Il prossimo potrebbe essere un caffè.</p>'}`}
function rewardsView(){return `<div class="eyebrow">Hai corso. Ora scegli.</div><h1>Piccoli premi.<br>Grandi motivazioni.</h1><div class="row"><p>Il tuo saldo</p><strong>✦ ${fmt(state.points)} punti</strong></div><div class="chips">${['Tutti','500–999 pt','1.000–1.999 pt','2.000+ pt'].map((t,i)=>`<button class="${filter===i?'active':''}" onclick="filter=${i};render()">${t}</button>`).join('')}</div>${rewards.filter(r=>filter===0||filter===1&&r.cost<1000||filter===2&&r.cost>=1000&&r.cost<2000||filter===3&&r.cost>=2000).map(r=>`<article class="card reward"><div class="row"><div class="reward-icon">${r.icon}</div><div><h3>${r.name}</h3><p>${r.partner} · Partner demo</p></div></div><p style="margin-top:16px">${r.desc}</p><div class="tag">${fmt(r.cost)} punti · ${r.cost/100} km equivalenti</div><progress max="${r.cost}" value="${Math.min(state.points,r.cost)}"></progress><button class="btn ${state.points>=r.cost?'lime':'secondary'}" ${state.points<r.cost?'disabled':''} onclick="confirmReward(${r.id})">${state.points>=r.cost?'Riscatta premio':`Mancano ${fmt(r.cost-state.points)} punti`}</button></article>`).join('')}<p class="notice">Premi, partner e conversione sono esempi. Il riscatto genera un voucher demo e sottrae i punti dal saldo.</p>`}
function profileView(){let p=state.profile;return `<div class="eyebrow">Il tuo punto di partenza</div><h1>Ogni runner<br>ha la sua storia.</h1><div class="avatar">${esc(p.name.slice(0,2).toUpperCase())}</div><form onsubmit="saveProfile(event)"><h2>Informazioni di base</h2><label for="name">Nome</label><input id="name" name="name" required maxlength="40" value="${esc(p.name)}" autocomplete="given-name"><div class="row"><div style="flex:1"><label for="age">Età</label><input id="age" name="age" type="number" min="1" max="120" required value="${p.age}"></div><div style="flex:2"><label for="city">Città</label><input id="city" name="city" required maxlength="60" value="${esc(p.city)}"></div></div><h2>Tu e la corsa</h2>${[['level','Livello',['Principiante','Intermedio','Esperto']],['goal','Il tuo obiettivo',['Iniziare a correre','5 km','10 km','Mezza maratona','Maratona']],['frequency','Quante volte corri?',['1 volta a settimana','2 volte a settimana','3 volte a settimana','4 o più volte a settimana']]].map(([key,label,opts])=>`<label for="${key}">${label}</label><select id="${key}" name="${key}">${opts.map(o=>`<option ${p[key]===o?'selected':''}>${o}</option>`).join('')}</select>`).join('')}<button class="btn lime" type="submit">Salva il profilo</button></form><p class="notice">Dati salvati soltanto in questo browser, se lo spazio locale è disponibile. Nessun account, nessun invio a server.</p><button class="link" onclick="resetDemo()">Ripristina tutti i dati dimostrativi</button>`}
function render(){const views={run:runView,wallet:walletView,rewards:rewardsView,profile:profileView};$('#view').innerHTML=views[page]();$('nav').innerHTML=[['run','↗','Corri'],['wallet','◈','Wallet'],['rewards','☆','Premi'],['profile','◎','Profilo']].map(([p,i,n])=>`<button aria-label="${n}" class="${page===p?'active':''}" ${page===p?'aria-current="page"':''} onclick="go('${p}')"><b>${i}</b>${n}</button>`).join('')}
function startRun(){session={active:true,paused:false,seconds:0,km:0};render()}function pauseRun(){session.paused=!session.paused;render()}function addKm(){if(session.paused){notify('Riprendi la corsa per aggiungere chilometri.');return}session.km+=1;session.seconds+=360;render()}function finishRun(){let points=Math.floor(session.km*100);state.points+=points;state.km=Math.round((state.km+session.km)*1000)/1000;if(session.km>0)state.activities.unshift({name:'Corsa demo completata',detail:`${fmt(session.km)} km · ${time(session.seconds)}`,points});save();session={active:false,paused:false,seconds:0,km:0};go('wallet');notify(`Corsa terminata: +${points} punti nel wallet.`)}
function saveProfile(e){e.preventDefault();let d=new FormData(e.target);state.profile=Object.fromEntries(d);state.profile.age=Number(state.profile.age);save();notify('Profilo aggiornato');render()}
function confirmReward(id){let r=rewards.find(r=>r.id===id);$('#modal').innerHTML=`<h2>Un premio meritato.</h2><p>${r.name} · ${r.partner}</p><p>Usi <strong>${fmt(r.cost)} punti</strong>. Il nuovo saldo sarà ${fmt(state.points-r.cost)} punti.</p><p class="notice">Voucher di esempio, senza valore commerciale.</p><button class="btn lime" onclick="redeem(${id})">Conferma riscatto</button><button class="btn secondary" onclick="$('#modal').close()">Annulla</button>`;$('#modal').showModal()}
function redeem(id){let r=rewards.find(r=>r.id===id);if(state.points<r.cost)return;state.points-=r.cost;let code='RUN-'+Math.random().toString(36).slice(2,8).toUpperCase();state.vouchers.unshift({...r,code});state.activities.unshift({name:r.name,detail:'Premio demo riscattato',points:-r.cost});save();$('#modal').innerHTML=`<h2>Il premio è tuo! ✦</h2><p>${r.name}</p><div class="code">${code}</div><p class="notice">Codice dimostrativo: non utilizzabile presso esercizi commerciali. Lo ritrovi nel wallet.</p><button class="btn lime" onclick="$('#modal').close();go('wallet')">Vai al wallet</button>`;render()}
function resetDemo(){$('#modal').innerHTML='<h2>Ripartire da zero?</h2><p>Profilo, corse e voucher di questa demo verranno ripristinati.</p><button class="btn" onclick="state=initial();session={active:false,paused:false,seconds:0,km:0};save();$(\'#modal\').close();render()">Ripristina demo</button><button class="btn secondary" onclick="$(\'#modal\').close()">Annulla</button>';$('#modal').showModal()}
setInterval(()=>{if(session.active&&!session.paused){session.seconds++;session.km+=1/360;if(page==='run'){$('#distance').innerHTML=fmt(session.km)+' <span class="unit">km</span>';$('#time').textContent=time(session.seconds);$('#earned').textContent='+'+Math.floor(session.km*100)+' punti previsti'}}},1000);render();
</script></html>
